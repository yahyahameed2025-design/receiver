<style>

:root{--bg:#f3f5ff;--card:#ffffffd9;--tx:#161a2e;--mut:#6a7090;--pri:#5b4bff;--pri2:#00c2ff;--bd:#e0e4f5;--in:#f7f8ff;--err:#e5484d;--ok:#12b76a;--sh:0 10px 40px #5b4bff22}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1c;--card:#171a2dd9;--tx:#eef0ff;--mut:#9aa0c3;--bd:#2a2f4d;--in:#11142580;--sh:0 10px 40px #0008}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--pri);top:-120px;inset-inline-start:-100px}
.b2{width:360px;height:360px;background:var(--pri2);bottom:-100px;inset-inline-end:-80px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;gap:8px;padding:12px 20px;position:sticky;top:0;z-index:5;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{width:240px;height:46px;padding:7px 12px;flex:none;overflow:hidden;border-radius:10px;background:#fff;border:1px solid var(--bd);display:block}.logo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
#auto{font-size:12.5px;color:var(--mut);white-space:nowrap}
@media(max-width:600px){header{flex-wrap:wrap;padding:10px 12px}header button{padding:7px 11px}header b{display:none}.logo{width:170px;height:38px;padding:6px 10px;margin-inline-end:auto}}
header b{flex:1;font-size:17px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:var(--sh)}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0;color:#fff;font-weight:bold}
button:disabled{opacity:.6;pointer-events:none}
button.p.ld::after{content:"";display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;margin-inline-start:8px;vertical-align:-2px;animation:spin .7s linear infinite}
main{max-width:980px;margin:28px auto;padding:0 14px}
.sec{animation:up .5s both}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:var(--sh);margin-bottom:16px}
.auth{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}
.hero{background:linear-gradient(145deg,var(--pri),var(--pri2));color:#fff;padding:36px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero h1{margin:0;font-size:28px;line-height:1.4}.hero p{margin:0;opacity:.9}
.hero li{list-style:none;margin:6px 0;background:#ffffff26;padding:9px 13px;border-radius:12px}.hero ul{padding:0;margin:8px 0 0}
.form{padding:28px}
@media(max-width:700px){.auth{grid-template-columns:1fr}.hero{padding:22px}.hero ul{display:none}}
.tabs{display:flex;background:var(--in);border-radius:14px;padding:4px;margin-bottom:10px;position:relative}
.tabs button{flex:1;border:0;background:none;box-shadow:none!important;transform:none!important;z-index:1}
.tabs .on{background:var(--card);box-shadow:0 2px 10px #0002!important;font-weight:bold;color:var(--pri)}
.fld{position:relative}
label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 5px}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:var(--in);color:var(--tx);font:inherit;transition:.2s;outline:0}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px #5b4bff22}
.eye{position:absolute;inset-inline-end:8px;top:30px;border:0;background:none;padding:4px 8px;box-shadow:none!important}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:560px){.g{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}@media(max-width:560px){.g3{grid-template-columns:1fr}}
.err{color:var(--err);font-size:13.5px;min-height:22px;margin:8px 0}
.ob{display:flex;gap:12px;justify-content:center;direction:ltr;margin:20px 0}
.ob input{width:60px;height:68px;text-align:center;font-size:28px;font-weight:bold;padding:0}
.center{text-align:center}.mut{color:var(--mut)}
.lnk{border:0;background:none;color:var(--pri);box-shadow:none!important;padding:4px}
.hi{font-size:54px;animation:up .6s both}
.pc{padding:0;overflow:hidden;animation:up .4s both}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer}
.num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:bold;font-size:14px}
.ph b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:5px;background:var(--in)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.4s}
.pb{padding:4px 18px 18px}.pc.cl .pb{display:none}
.sw{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.sw label{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);cursor:pointer;font-size:14px}
.sw input{display:none}.sw span{width:42px;height:24px;background:var(--bd);border-radius:12px;position:relative;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span::after{inset-inline-start:21px}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.dz{width:96px;height:96px;border:2px dashed var(--bd);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:12px;cursor:pointer;transition:.2s}
.dz:hover,.dz.dr{border-color:var(--pri);color:var(--pri);background:#5b4bff10}
.im{position:relative}.im img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:1px solid var(--bd)}
.im i{position:absolute;top:-7px;inset-inline-end:-7px;background:var(--err);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;cursor:pointer;line-height:22px}
.add{width:100%;border:2px dashed var(--pri);color:var(--pri);padding:16px;background:transparent}
.cnt{background:#fff3;border-radius:10px;padding:2px 9px;font-size:13px}
.hide{display:none!important}
#modal,#lgModal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9;animation:up .25s both}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:22px;padding:24px;width:min(400px,92vw);text-align:center}
.data{border:2px solid var(--pri);border-radius:16px;padding:18px;margin:14px 0;cursor:pointer;font-weight:bold;background:#5b4bff12;transition:.2s}.data:hover{transform:scale(1.02)}
#toast{position:fixed;bottom:22px;inset-inline:0;text-align:center;z-index:10;pointer-events:none}
#toast span{background:#161a2e;color:#fff;padding:11px 20px;border-radius:22px;animation:up .3s both;display:inline-block}

.shop{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;cursor:pointer;margin-bottom:12px;transition:.2s;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh);animation:up .4s both}
.shop:hover{transform:translateY(-2px);border-color:var(--pri)}
.av{width:48px;height:48px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:bold;font-size:20px}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mut)}
.bd{padding:4px 12px;border-radius:20px;font-size:12.5px;background:#5b4bff1a;color:var(--pri);white-space:nowrap}
.bd.ok{background:#12b76a1f;color:var(--ok)}.bd.dr{background:#f7900922;color:#d97706}
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.top h2{margin:0;flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--in);border-radius:10px;padding:8px 11px}.kv small{display:block;color:var(--mut);font-size:11.5px}.kv span{font-size:14px;word-break:break-word}
.th{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.th img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.ds{background:var(--in);border-radius:12px;padding:10px 13px;margin-top:12px;font-size:14px;line-height:1.7;white-space:pre-wrap}.ds small{display:block;color:var(--mut);font-size:11.5px}
.ir{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--bd);text-align:start}.ir span:first-child{color:var(--mut)}.ir span:last-child{font-weight:bold;word-break:break-word}
input.s{margin-bottom:14px}
</style>
<style id="fx">
/* ===== MOTION PACK ===== */
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94) rotateX(12deg)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(calc(var(--d,1)*-60px)) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
@keyframes spring{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes gradMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #5b4bff00}50%{box-shadow:0 0 22px 2px #00c2ff55}}
@keyframes fp{from{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.8}to{transform:translate(var(--sx,40px),-115vh) scale(1.2);opacity:0}}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(520px circle at var(--gx,70%) var(--gy,20%),#00c2ff1f,transparent 65%)}
.b3{width:300px;height:300px;background:#ff5fa2;top:42%;inset-inline-start:45%;opacity:.26;animation-duration:19s;animation-delay:-4s}
#fxp{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#fxp i{position:absolute;bottom:-24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffb,#5b4bff55);animation:fp linear infinite}
header{animation:drop .8s cubic-bezier(.2,.9,.3,1.2) backwards}
.logo{animation:float 4.5s ease-in-out infinite alternate,glow 3.5s ease-in-out infinite}
.sec{animation:pop .65s cubic-bezier(.2,.85,.25,1) backwards}
.card,.shop{position:relative;overflow:hidden}
.card::after,.shop::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),#5b4bff26,transparent 60%)}
.card:hover::after,.shop:hover::after{opacity:1}
.shop,.pc,#plist>.card{animation:none}
#slist>.shop{--d:1;animation:slideIn .6s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i,0)*70ms)}
[dir=ltr] #slist>.shop{--d:-1}
#plist>.card{animation:rise .65s cubic-bezier(.2,.9,.3,1.1) backwards!important;animation-delay:calc(var(--i,0)*80ms)!important;transition:transform .3s,box-shadow .3s}
#plist>.card:hover{transform:translateY(-3px)}
.shop{transition:transform .3s cubic-bezier(.2,.9,.3,1.3),border-color .3s,box-shadow .3s}
.shop:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 16px 44px #5b4bff38}
.av{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.shop:hover .av{transform:rotate(-10deg) scale(1.14)}
.shop>.mut{transition:transform .3s}[dir=rtl] .shop:hover>.mut{transform:translateX(-8px)}[dir=ltr] .shop:hover>.mut{transform:translateX(8px)}
button{position:relative;overflow:hidden}
button:active{transform:scale(.95)!important}
button.p{background-size:220% 220%;animation:gradMove 6s ease infinite}
button.p::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rp .65s ease-out;pointer-events:none}
button:not(.p) .rp{background:#5b4bff33}
.hero{position:relative;overflow:hidden;background-size:220% 220%;animation:gradMove 11s ease infinite}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#ffffff1f;pointer-events:none}
.hero::before{width:230px;height:230px;top:-70px;inset-inline-end:-70px;animation:float 7s ease-in-out infinite alternate}
.hero::after{width:150px;height:150px;bottom:-40px;inset-inline-start:-30px;animation:float 9s ease-in-out infinite alternate-reverse}
.hero h1,.hero p{position:relative;animation:slideIn .8s cubic-bezier(.2,.9,.3,1) backwards}.hero p{animation-delay:.15s}
.hero li{position:relative;animation:slideIn .7s cubic-bezier(.2,.9,.3,1.1) backwards,bob 4.5s ease-in-out infinite}
.hero li:nth-child(1){animation-delay:.3s,1s}.hero li:nth-child(2){animation-delay:.45s,1.5s}.hero li:nth-child(3){animation-delay:.6s,2s}
.hi{display:inline-block;transform-origin:70% 70%;animation:spring .8s cubic-bezier(.3,1.6,.5,1) backwards,wave 2.6s ease-in-out 1s infinite}
.ob input{animation:spring .55s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s}
.ob input:nth-child(2){animation-delay:.08s}.ob input:nth-child(3){animation-delay:.16s}.ob input:nth-child(4){animation-delay:.24s}
.ob input:focus{transform:translateY(-6px) scale(1.08)}
input:focus,textarea:focus{box-shadow:0 0 0 4px #5b4bff2a,0 8px 24px #5b4bff22}
.tabs .on{transition:all .35s cubic-bezier(.3,1.4,.5,1)}
.bar i{background-size:220% 100%;animation:gradMove 2.2s linear infinite}
.num{transition:transform .4s cubic-bezier(.3,1.8,.5,1)}.pc:hover .num,.card:hover>div>.num{transform:rotate(360deg) scale(1.12)}
.dz{animation:bob 3.4s ease-in-out infinite}.dz:hover{animation-play-state:paused;transform:scale(1.08)}
.im img{transition:transform .3s}.im:hover img,.th img:hover{transform:scale(1.08) rotate(-1.5deg)}.th img{transition:transform .3s}
.bd.dr::before,.bd.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:6px;vertical-align:1px}
.bd.dr::before{animation:pulse 1.5s infinite}
.add{transition:all .3s}.add:hover{background:#5b4bff14;transform:scale(1.015)}
.box{animation:spring .55s cubic-bezier(.34,1.56,.64,1) backwards}.data{animation:bob 3s ease-in-out infinite}
#toast span{animation:spring .5s cubic-bezier(.34,1.56,.64,1) backwards}
.kv div{transition:transform .25s,background .25s}.kv div:hover{transform:translateY(-3px);background:#5b4bff14}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#fxp{display:none}}
</style>
<style id="appr">
button.p.g{background:linear-gradient(135deg,#0e9f6e,#34d399);background-size:220% 220%}
#cfwarn{color:#d97706;font-size:14px;margin-top:12px}
.shop>*{position:relative;z-index:1}
.shop::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,#0e9f6e,#34d399);transform:scaleX(0);transform-origin:left center;pointer-events:none}
[dir=rtl] .shop::before{transform-origin:right center}
@keyframes fillg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shop.filling::before{animation:fillg 1.5s cubic-bezier(.65,0,.35,1) forwards}
.shop.done::before{transform:scaleX(1)}
.shop.filling,.shop.done{border-color:#12b76a}
.shop.done .nm b,.shop.done .nm small,.shop.done>.mut{color:#fff}
.shop.filling .nm b,.shop.filling .nm small,.shop.filling>.mut{color:#fff;transition:color .4s .75s}
.shop.done .bd,.shop.filling .bd{background:#ffffff33;color:#fff}
.shop.done .av,.shop.filling .av{background:#ffffff40}
</style>

<style id="perf">
:root{--card:#ffffffee}@media(prefers-color-scheme:dark){:root{--card:#171a2dee}}
header,.card,.shop,.box,.tabs{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.blob{filter:blur(60px);will-change:transform}
.lite #fxp,.lite .b3{display:none}.lite .blob{animation:none}
.lite button.p,.lite button.p::before,.lite .logo,.lite .hero,.lite .bar i{animation:none!important}
</style>

let lang = localStorage.lang || 'ar', shops = [], cur = null, view = 'list';
const $ = id => document.getElementById(id), t = k => T[lang][k] || k;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const toast = m => { $('toast').innerHTML = '<span>' + m + '</span>'; setTimeout(() => $('toast').innerHTML = '', 3000); };
const busy = (b, on) => { b.disabled = on; b.classList.toggle('ld', on); };
const yn = v => v === 'Yes' ? t('yes') : v === 'No' ? t('no') : v;
const thumb = u => { const m = /\/d\/([-\w]+)/.exec(u); return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400' : u; };

function show(v){ view = v;
  ['list','detail','confirm'].forEach(x => { const e = $(x); e.classList.toggle('hide', x !== v); if (x === v) { e.style.animation = 'none'; e.offsetHeight; e.style.animation = ''; } });
  ['backBtn','infoBtn','dlBtn'].forEach(id => $(id).classList.toggle('hide', v !== 'detail')); $('refBtn').classList.toggle('hide', v !== 'list'); $('doneBtn').classList.add('hide'); }
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = t(e.dataset.ph));
  $('brand').textContent = t('brand'); $('langBtn').textContent = lang === 'ar' ? 'EN' : 'عربي';
  renderShops(); if (cur) renderDetail(); }
$('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.lang = lang; applyLang(); };

async function api(action, data){
  if (API_URL.includes('PASTE')) return { ok:false, error:'setup' };
  try { const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action, ...data }), signal: AbortSignal.timeout(action === 'images' ? 180000 : 60000) }); return await r.json(); }
  catch(e) { return { ok:false, error: e && e.name === 'TimeoutError' ? 'timeout' : 'net' }; } }

// ExcelJS is loaded in the background (never blocks the page); falls back to a second CDN
let xlP = null;
function loadExcel(){ if (typeof ExcelJS !== 'undefined') return Promise.resolve(); if (xlP) return xlP;
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true;
    const to = setTimeout(() => { s.remove(); rej(); }, 20000); s.onload = () => { clearTimeout(to); res(); }; s.onerror = () => { clearTimeout(to); rej(); }; document.head.appendChild(s); });
  xlP = load('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js').catch(() => load('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js')).catch(() => { xlP = null; throw new Error('net'); });
  return xlP; }

let loaded = false;
async function loadShops(fresh){
  loaded = false; const t0 = Date.now(); $('tm').textContent = '';
  $('slist').innerHTML = '<div class="card center mut">' + t('loading') + ' <span id="ld">0</span>s</div>';
  const iv = setInterval(() => { const e = $('ld'); if (e) e.textContent = Math.round((Date.now() - t0) / 1000); }, 1000);
  const r = await api('shops', fresh === true ? { fresh:true } : {}); clearInterval(iv);
  if (!r.ok) { $('slist').innerHTML = '<div class="card center" style="color:var(--err)">' + esc(T[lang][r.error] || r.error) + '</div>'; return; }
  $('tm').textContent = '⏱ ' + ((Date.now() - t0) / 1000).toFixed(1) + 's' + (r.t ? ' · server ' + (r.t.total / 1000).toFixed(1) + 's' : ' · cache');
  shops = r.shops; loaded = true;
  try { renderShops(); } catch(e) { $('slist').innerHTML = '<div class="card center" style="color:var(--err)">' + esc(e.message) + '</div>'; }
  setTimeout(() => loadExcel().catch(() => {}), 2500); }
function renderShops(){
  if (!loaded) return;
  const q = $('q').value.trim().toLowerCase(), l = shops.filter(s => (s.company + ' ' + s.email).toLowerCase().includes(q)).sort((a, b) => (a.approved ? 1 : 0) - (b.approved ? 1 : 0));
  $('total').textContent = shops.length + ' ' + (lang === 'ar' ? 'محل' : 'shops');
  $('slist').innerHTML = l.length ? l.map(s => `<div class="shop${s.approved ? ' done' : ''}" data-e="${esc(s.email)}"><div class="av">${esc(String(s.company || '?').trim().charAt(0).toUpperCase())}</div>
    <div class="nm"><b>${esc(s.company || s.email)}</b><small>${esc(s.email)} · ${t('updated')}: ${esc(s.updated)}</small></div>
    <span class="bd">${s.count} ${t('products')}</span>${s.approved ? '<span class="bd">✓ ' + t('doneb') + '</span>' : ''}<span class="mut">${lang === 'ar' ? '◀' : '▶'}</span></div>`).join('')
    : '<div class="card center mut">' + t('empty') + '</div>'; }
$('q').oninput = renderShops; $('refBtn').onclick = () => loadShops(true);
$('slist').onclick = e => { const el = e.target.closest('.shop'); if (el) openShop(el.dataset.e); };
$('backBtn').onclick = () => show('list');

async function openShop(email){
  $('dhead').innerHTML = ''; $('plist').innerHTML = '<div class="card center mut">' + t('loading') + '</div>'; show('detail');
  const r = await api('shop', { email });
  if (!r.ok) { $('plist').innerHTML = '<div class="card center" style="color:var(--err)">' + esc(T[lang][r.error] || r.error) + '</div>'; return; }
  cur = r; renderDetail(); window.scrollTo(0, 0); }
function renderDetail(){
  if (!cur) return; const i = cur.info, ps = cur.products, name = String(i.company || i.email || '');
  $('dhead').innerHTML = `<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">${esc(name.trim().charAt(0).toUpperCase())}</div>
    <div class="nm"><b style="font-size:20px">${esc(name)}</b><small>${esc(i.email)}</small></div>${cur.approved ? '<span class="bd ok" style="margin-inline-end:8px">✓ ' + t('approvedb') + '</span>' : ''}<span class="bd">${ps.length} ${t('products')}</span></div>`;
  if (view === 'detail') $('doneBtn').classList.toggle('hide', !!cur.approved);
  const F = ['type','category','price','qty','maxQty','days','hours','mins','size','attrs','offer','stock'];
  $('plist').innerHTML = ps.length ? ps.map((p, n) => `<div class="card" style="animation:up .4s both;animation-delay:${Math.min(n, 8) * .05}s">
    <div style="display:flex;gap:10px;align-items:center"><div class="num" style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:bold;font-size:14px;flex:none">${n + 1}</div>
    <div class="nm"><b>${esc(p.nameEn || p.nameAr)}</b><small>${esc(p.nameAr)}</small></div><span class="bd ${p.status === 'Saved' ? 'ok' : 'dr'}">${t(p.status)}</span></div>
    ${p.images.length ? `<div class="th">${p.images.map(u => `<img src="${esc(thumb(u))}" loading="lazy">`).join('')}</div>` : ''}
    ${p.descEn ? `<div class="ds"><small>${t('descEn')}</small>${esc(p.descEn)}</div>` : ''}${p.descAr ? `<div class="ds"><small>${t('descAr')}</small>${esc(p.descAr)}</div>` : ''}
    <div class="kv">${F.filter(k => String(p[k]).trim() !== '').map(k => `<div><small>${t(k)}</small><span>${esc(['offer','stock'].includes(k) ? yn(p[k]) : p[k])}</span></div>`).join('')}</div></div>`).join('')
    : '<div class="card center mut">' + t('noprod') + '</div>'; }

$('infoBtn').onclick = () => { const i = cur.info, rows = [['company', i.company], ['name', i.name], ['email', i.email], ['phone', i.phone], ['cr', i.cr], ['created', i.created],
  ['verified', i.verified === undefined ? '' : (i.verified ? t('yes') : t('no'))], ['pcount', cur.products.length]];
  $('irows').innerHTML = rows.filter(r => r[1] !== undefined && r[1] !== '').map(r => `<div class="ir"><span>${t(r[0])}</span><span dir="auto">${esc(r[1])}</span></div>`).join('');
  $('modal').classList.remove('hide'); };
$('closeM').onclick = () => $('modal').classList.add('hide');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.add('hide'); };

// ---- Excel download: same layout as the template file ----
const HEAD = ['Product Name (English)','Product Name (Arabic) *','Description (English) *','Images ','Description (Arabic) *','Product Type *','Product Category *','Preparing Days','Preparing Hours *','Preparing Minutes *','Quantity *','\nMax Order Quantity *','Price *','Has Offer','\nIn Stock','Attributes','Size','Color'];
const WID = [38.4,47.6,42.7,32,70.7,51.3,35.3,34.9,58.3,41.7,19.4,34.1,16,14,14,30,31.8,20];
const FNT = [{sz:11,b:1},{sz:11,b:1},{sz:10},{sz:10},{sz:10},{sz:20},{sz:18,b:1},{sz:14,b:1},{sz:14,b:1},{sz:14,b:1},{sz:14,b:1},{sz:14,b:1},{sz:12,b:1},{sz:12,b:1},{sz:12,b:1},{sz:10},{sz:10,b:1},{sz:10}];
const BRD = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };
const dims = b64 => new Promise(res => { const im = new Image(); im.onload = () => res({ w:im.width, h:im.height }); im.onerror = () => res(null); im.src = 'data:image/jpeg;base64,' + b64; });

$('dlBtn').onclick = async () => {
  const b = $('dlBtn'); busy(b, true); toast(t('dling'));
  try {
    await loadExcel();
    const r = await api('images', { email: cur.info.email }); if (!r.ok) throw new Error(r.error);
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('Sheet1');
    WID.forEach((w, i) => ws.getColumn(i + 1).width = w);
    const h = ws.addRow(HEAD); h.height = 32;
    for (let c = 1; c <= 18; c++) { const x = h.getCell(c);
      x.font = { name:'Arial', size:17, bold:true, color:{ argb:'FF0F172A' } }; x.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFA4C2F4' } };
      x.alignment = { horizontal:'center', vertical:'middle', wrapText:true }; x.border = BRD; }
    const RH = 150, BH = 186, DW = 229; // row height (pt), image box height (px), column D width (px)
    for (let n = 0; n < cur.products.length; n++) {
      const p = cur.products[n];
      const row = ws.addRow([p.nameEn, p.nameAr, p.descEn, '', p.descAr, p.type, p.category, p.days, p.hours, p.mins, p.qty, p.maxQty, p.price, p.offer, p.stock, p.attrs, p.size, '']);
      row.height = RH;
      for (let c = 1; c <= 18; c++) { const x = row.getCell(c), f = FNT[c - 1];
        x.font = { name:'Arial', size:f.sz, bold:!!f.b }; x.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFD0E0E3' } };
        x.alignment = { horizontal:'center', vertical:'middle', wrapText:true }; x.border = BRD; }
      const imgs = (r.images[p.id] || []).slice(0, 2), bw = imgs.length === 1 ? 215 : 108;
      for (let k = 0; k < imgs.length; k++) {
        const d = await dims(imgs[k]); if (!d) continue;
        const s = Math.min(bw / d.w, BH / d.h), w = d.w * s, hh = d.h * s;
        const id = wb.addImage({ base64:'data:image/jpeg;base64,' + imgs[k], extension:'jpeg' });
        const x0 = imgs.length === 1 ? 7 : 4 + k * 112;
        ws.addImage(id, { tl:{ col: 3 + (x0 + (bw - w) / 2) / DW, row: n + 1 + (RH * 96 / 72 - hh) / 2 / (RH * 96 / 72) }, ext:{ width:w, height:hh }, editAs:'oneCell' });
      }
    }
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = ((cur.info.company || 'shop').replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'shop') + ' - products.xlsx'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(t('dldone'));
  } catch(e) { toast(t('dlfail')); }
  busy(b, false);
};

// ---- approval ("Done") flow ----
const RMo = matchMedia('(prefers-reduced-motion:reduce)').matches, wait = ms => new Promise(r => setTimeout(r, ms));
const kvb = (k, v) => `<div><small>${k}</small><span>${v}</span></div>`;
function toDetail(){ show('detail'); renderDetail(); }
$('doneBtn').onclick = () => { const i = cur.info, ps = cur.products, dr = ps.filter(p => p.status !== 'Saved').length;
  $('cfmsg').textContent = t('cfmsg').replace('{n}', i.company || i.email);
  $('cfkv').innerHTML = kvb(t('pcount'), ps.length) + kvb(t('cfk2'), ps.length - dr) + kvb(t('cfk3'), dr);
  $('cfwarn').textContent = dr ? t('cfwarn').replace('{n}', dr) : ''; show('confirm'); window.scrollTo(0, 0); };
$('noBtn').onclick = toDetail;
$('okBtn').onclick = async () => {
  const email = cur.info.email, b = $('okBtn'); busy(b, true);
  const r = await api('approve', { email }); busy(b, false);
  if (!r.ok) return toast(t('apfail'));
  cur.approved = true; const s = shops.find(x => x.email === email);
  show('list'); window.scrollTo(0, 0); if (!s) { loadShops(); return; }
  const find = () => document.querySelector('.shop[data-e="' + email + '"]');
  let el = find(); if (el) el.scrollIntoView({ block:'center', behavior: RMo ? 'auto' : 'smooth' });
  await wait(RMo ? 0 : 900);                       // 1) the green fills the shop row
  el = find(); if (el) el.classList.add('filling');
  await wait(RMo ? 0 : 1800);                      // 2) then the row runs to the end of the list
  const pos = new Map(); document.querySelectorAll('.shop').forEach(e => pos.set(e.dataset.e, e.getBoundingClientRect().top + scrollY));
  s.approved = true; renderShops();
  document.querySelectorAll('.shop').forEach(e => { const o = pos.get(e.dataset.e); if (o == null) return;
    const dy = o - (e.getBoundingClientRect().top + scrollY); if (!dy) return;
    e.style.animation = 'none'; e.style.transition = 'none'; e.style.transform = 'translateY(' + dy + 'px)'; e.offsetHeight;
    e.style.transition = 'transform 1s cubic-bezier(.3,1.15,.4,1)'; e.style.transform = ''; });
  setTimeout(() => document.querySelectorAll('.shop').forEach(e => e.style.transition = ''), 1300);
  const m = find(); if (m) setTimeout(() => m.scrollIntoView({ block:'center', behavior:'smooth' }), 150);
  toast(t('okmsg'));
};

applyLang(); show('list'); loadShops();
</script>
<script id="fxjs">
/* ===== MOTION PACK JS ===== */
(()=>{
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches, $=id=>document.getElementById(id);
const b3=document.createElement('div');b3.className='blob b3';document.body.prepend(b3);
const fp=document.createElement('div');fp.id='fxp';document.body.prepend(fp);
for(let i=0;i<10;i++){const p=document.createElement('i'),s=6+Math.random()*16;
 p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*15}s;--sx:${(Math.random()-.5)*160}px`;fp.appendChild(p);}
let raf=0;
addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
 document.body.style.setProperty('--gx',e.clientX+'px');document.body.style.setProperty('--gy',e.clientY+'px');
 const el=e.target.closest&&e.target.closest('.card,.shop');if(el){const r=el.getBoundingClientRect();el.style.setProperty('--mx',e.clientX-r.left+'px');el.style.setProperty('--my',e.clientY-r.top+'px');}});});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.disabled||RM)return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rp';
 s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),700);});
// staggered entrance: only new cards animate, re-renders don't replay
const watch=(id,addMode)=>{const el=$(id);if(!el)return;let prev=0,prevLoad=false;
 new MutationObserver(()=>{const L=[...el.children],n=L.length,load=!!(L[0]&&L[0].classList.contains('center')&&n===1);
  if(addMode&&n===prev+1&&prev>0&&!prevLoad){L.forEach((c,i)=>{if(i<prev)c.style.setProperty('animation','none','important');else c.style.setProperty('--i',0);});}
  else if(n===prev&&n>0&&!load){L.forEach(c=>c.style.setProperty('animation','none','important'));}
  else L.forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10)));
  prev=n;prevLoad=load;}).observe(el,{childList:true});
 const sec=el.closest('section');if(sec)new MutationObserver(()=>{if(!sec.classList.contains('hide'))prev=0;}).observe(sec,{attributes:true,attributeFilter:['class']});};
watch('slist',false);watch('plist',true);
// count-up numbers
const cu=id=>{const el=$(id);if(!el)return;
 new MutationObserver(()=>{const m=/^(\d+)(.*)$/.exec(el.textContent);if(!m||el._run||el.textContent===el._done||RM)return;
  const to=+m[1],rest=m[2];if(to<2){el._done=el.textContent;return;}el._run=1;const t0=performance.now(),fin=el.textContent;
  (function st(t){const k=Math.min(1,(t-t0)/800);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+rest;
   if(k<1)requestAnimationFrame(st);else{el._done=fin;el.textContent=fin;el._run=0;}})(t0);
 }).observe(el,{childList:true,characterData:true,subtree:true});};
cu('total');cu('cnt');
// confetti on success toasts
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';
 c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),cols=['#5b4bff','#00c2ff','#12b76a','#ffb020','#ff5fa2'];
 const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-13-3,s:Math.random()*8+4,r:Math.random()*6,vr:(Math.random()-.5)*.45,c:cols[Math.random()*5|0]}));
 let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.36;p.vx*=.99;p.r+=p.vr;
  x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
  if(++f<120)requestAnimationFrame(a);else c.remove();})();}
const tt=$('toast');if(tt&&!RM)new MutationObserver(()=>{if(tt.textContent.includes('✅'))confetti();}).observe(tt,{childList:true});
})();
</script>
